<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DAX 40 Pressespiegel</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">DAX</span>
      <div>
        <h1>DAX 40 Pressespiegel</h1>
        <p>Stimmungsbild aus deutscher &amp; internationaler Presse</p>
      </div>
    </div>
    <div class="controls">
      <label>Zeitraum
        <select id="window-select">
          <option value="1">24 Stunden</option>
          <option value="3">3 Tage</option>
          <option value="7" selected>7 Tage</option>
          <option value="14">14 Tage</option>
          <option value="30">30 Tage</option>
        </select>
      </label>
      <label>Sortierung
        <select id="sort-select">
          <option value="articles">meiste Artikel</option>
          <option value="best">positivstes Sentiment</option>
          <option value="worst">negativstes Sentiment</option>
          <option value="name">A-Z</option>
        </select>
      </label>
      <label>Filter
        <input id="filter-input" type="search" placeholder="z.B. SAP, Auto, ..." />
      </label>
      <button id="scan-btn" title="Manuell scannen">SCAN</button>
      <span id="status-pill" class="pill">bereit</span>
    </div>
  </header>

  <section class="summary" id="summary-bar">
    <div class="summary-cell"><span class="label">positiv</span><strong id="sum-pos">--</strong></div>
    <div class="summary-cell"><span class="label">neutral</span><strong id="sum-neu">--</strong></div>
    <div class="summary-cell"><span class="label">negativ</span><strong id="sum-neg">--</strong></div>
    <div class="summary-cell"><span class="label">Artikel gesamt</span><strong id="sum-art">--</strong></div>
    <div class="summary-cell"><span class="label">letzter Scan</span><strong id="sum-scan">--</strong></div>
  </section>

  <main id="grid" class="grid"></main>

  <dialog id="detail-modal" class="modal">
    <button class="close" id="modal-close">×</button>
    <div id="modal-body"></div>
  </dialog>

  <footer class="footer">
    <span>DAX 40 Pressespiegel | lokal | open-source | ohne kostenpflichtige APIs</span>
    <span id="footer-ts"></span>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
